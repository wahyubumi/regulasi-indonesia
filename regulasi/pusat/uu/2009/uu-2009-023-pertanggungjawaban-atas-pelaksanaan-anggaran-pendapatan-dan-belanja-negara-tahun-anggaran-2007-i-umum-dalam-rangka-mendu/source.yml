id: uu-2009-023
judul: Undang-Undang Nomor 23 Tahun 2009 tentang PERTANGGUNGJAWABAN ATAS PELAKSANAAN
  ANGGARAN PENDAPATAN DAN BELANJA NEGARA TAHUN ANGGARAN 2007 I. UMUM Dalam rangka
  mendukung terwujudnya tata kelola yang baik dalam penyelenggaraan negara, pengelolaan
  keuangan negara perlu diselenggarakan secara terbuka dan bertanggung jawab sesuai
  dengan aturan pokok yang telah ditetapkan dalam Undang-Undang Dasar 1945. Sesuai
  dengan amanat Pasal 23E Undang-Undang Dasar 1945, Pasal 30 Undang- Undang Nomor
  17 Tahun 2003 tentang Keuangan Negara, dan Pasal 17 Undang-Undang Nomor 18 Tahun
  2006 tentang Anggaran Pendapatan dan Belanja Negara Tahun Anggaran 2007, Pemerintah
  menyusun pertanggungjawaban atas pelaksanaan APBN Tahun Anggaran 2007, berupa laporan
  keuangan. Laporan Keuangan Pemerintah Pusat (LKPP) yang terdiri atas (i) Laporan
  Realisasi APBN, (ii) Neraca, (iii) Laporan Arus Kas, dan (iv) Catatan atas Laporan
  Keuangan. Laporan Realisasi APBN menggambarkan perbandingan antara anggaran dan
  realisasi APBN Tahun Anggaran 2007, yang mencakup unsur-unsur No. 5026 2 pendapatan,
  belanja, dan pembiayaan. Neraca adalah laporan yang menggambarkan posisi keuangan
  pemerintah pusat mengenai aset, kewajiban, dan ekuitas dana pada tanggal 31 Desember
  2007. Laporan Arus Kas adalah laporan yang menyajikan informasi mengenai sumber,
  penggunaan, perubahan kas dan setara kas selama tahun anggaran 2007, serta saldo
  kas dan setara kas pada tanggal 31 Desember 2007. Catatan atas Laporan Keuangan
  menyajikan informasi tentang penjelasan pos-pos laporan keuangan dalam rangka pengungkapan
  yang memadai antara lain mengenai kebijakan fiskal/keuangan dan ekonomi makro, dasar
  penyusunan laporan keuangan, kebijakan akuntansi, kejadian penting lainnya, dan
  informasi tambahan yang diperlukan. Disamping itu, dalam LKPP Tahun 2007 ini juga
  dilampirkan Ikhtisar Laporan Keuangan Perusahaan Negara sebagaimana diamanatkan
  dalam Pasal 30 ayat (2) UU Nomor 17 Tahun 2003. Pada Laporan Realisasi APBN Tahun
  Anggaran 2007, realisasi Belanja Subsidi adalah sebesar Rp150.214.443.691.269 yang
  berarti lebih besar Rp45.141.074.219.269 dari APBN-P sebesar Rp105.073.369.472.000.
  Kelebihan tersebut terdiri dari kelebihan pembayaran subsidi energi dan subsidi
  pajak ditanggung pemerintah. Kelebihan pembayaran subsidi energi telah mendapat
  persetujuan Dewan Perwakilan Rakyat pada Rapat Kerja Panitia Anggaran Dewan Perwakilan
  Rakyat dengan Pemerintah dalam Rangka Pembicaraan Tingkat I/Pembahasan RUU tentang
  Anggaran Pendapatan dan Belanja Negara Tahun Anggaran 2008 beserta Nota Keuangannya
  pada tanggal 8 Oktober 2007, yang menyatakan bahwa pembayaran subsidi bahan bakar
  minyak (BBM) tahun 2007 dilakukan sesuai dengan realisasi dan Pemerintah dapat melakukan
  pembayaran subsidi listrik tahun 2007 di atas pagu anggaran sesuai kemampuan keuangan
  negara. Sementara itu, kelebihan pembayaran subsidi juga disebabkan adanya subsidi
  Pajak Pertambahan Nilai (PPN) dan Pajak Penghasilan (PPh) untuk pembayaran PPN BBM
  bersubsidi dan subsidi PPh atas bunga global bond yang ditanggung Pemerintah. Sisa
  Anggaran Lebih (SAL) sampai dengan Tahun Anggaran 2006 sesuai dengan Undang-Undang
  Nomor 8 Tahun 2009 tentang Pertanggungjawaban Pelaksanaan Anggaran Pendapatan dan
  Belanja Negara Tahun Anggaran 2006 adalah sebesar Rp18.830.302.308.895 (delapan
  belas triliun delapan ratus tiga puluh miliar tiga ratus dua juta tiga ratus delapan
  ribu delapan ratus sembilan puluh lima rupiah). SAL sebesar Rp18.830.302.308.895
  (delapan belas triliun delapan ratus tiga puluh miliar tiga ratus dua juta tiga
  ratus delapan ribu delapan ratus 3 No. 5026 sembilan puluh lima rupiah) di atas
  menjadi saldo awal SAL Tahun Anggaran 2007. Dalam Laporan Realisasi Anggaran Tahun
  Anggaran 2007, terdapat SiKPA sebesar Rp7.387.288.768.184 (tujuh triliun tiga ratus
  delapan puluh tujuh miliar dua ratus delapan puluh delapan juta tujuh ratus enam
  puluh delapan ribu seratus delapan puluh empat rupiah) dan terdapat selisih kas
  lebih Tahun Anggaran 2006 sebesar Rp1.927.500.597.697 (satu triliun sembilan ratus
  dua puluh tujuh miliar lima ratus juta lima ratus sembilan puluh tujuh ribu enam
  ratus sembilan puluh tujuh rupiah). Dengan demikian, SAL sampai dengan Tahun Anggaran
  2007 menjadi sebesar Rp18.830.302.308.895 (delapan belas triliun delapan ratus tiga
  puluh miliar tiga ratus dua juta tiga ratus delapan ribu delapan ratus sembilan
  puluh lima rupiah). Sesuai dengan ketentuan Pasal 30 ayat (1) Undang-Undang Nomor
  17 Tahun 2003 tentang Keuangan Negara, LKPP harus diaudit oleh Badan Pemeriksa Keuangan
  (BPK) sebelum disampaikan kepada Dewan Perwakilan Rakyat (DPR). Pemeriksaan BPK
  dimaksud adalah dalam rangka pemberian pendapat sebagaimana diamanatkan dalam Pasal
  16 ayat (1) Undang-Undang Nomor 15 Tahun 2004 tentang Pemeriksaan Pengelolaan dan
  Tanggung Jawab Keuangan Negara. Untuk memenuhi amanat Undang-Undang tersebut, Pemerintah
  telah menyampaikan LKPP Tahun 2007 kepada BPK untuk diaudit, melalui surat
