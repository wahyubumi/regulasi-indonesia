  10 Undang-undang Dasar; b. Undang-undang No. 21 tahun 1952 (Lembaran-Negara tahun
  1952 No. 78) tentang hak pengangkatan dan pemberhentian pegawai negeri sipil; c.
  Penetapan Presiden No. 1 tahun 1962 tentang Pembentukan Propinsi Irian Barat Bentuk
  Baru (Lembaran-Negara tahun 1962 No. 1 dan Tambahan Lembaran-Negara No. 2372); d.
  Penetapan Presiden No. 1 tahun 1963 tentang Pemerintahan Irian Barat segera setelah
  diserahkan kepada Republik Indonesia; Mendengar : Menteri Pertama, Wakil Menteri
