  yang bersangkutan; Memutuskan: Menetapkan ; Peraturan Presiden tentang Status dan
  Kedudukan Keuangan Pegawai Negeri Sipil dan Anggota Angkatan Kepolisian di Propinsi
  Irian Barat'
