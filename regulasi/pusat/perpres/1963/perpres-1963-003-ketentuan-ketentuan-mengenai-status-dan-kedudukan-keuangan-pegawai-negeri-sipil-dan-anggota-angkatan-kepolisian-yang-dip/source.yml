id: perpres-1963-003
judul: 'Peraturan Presiden Nomor 3 Tahun 1963 tentang ketentuan-ketentuan mengenai
  status dan kedudukan keuangan pegawai negeri sipil dan anggota Angkatan Kepolisian
  yang dipekerjakan di Propinsi Irian Barat selama jangka waktu yang ditentukan menurut
  Penetapan Presiden No. 1 tahun 1963; Mengingat : a. Pasal 4 ayat 1 dan pasal 10
  Undang-undang Dasar; b. Undang-undang No. 21 tahun 1952 (Lembaran-Negara tahun 1952
  No. 78) tentang hak pengangkatan dan pemberhentian pegawai negeri sipil; c. Penetapan
  Presiden No. 1 tahun 1962 tentang Pembentukan Propinsi Irian Barat Bentuk Baru (Lembaran-Negara
  tahun 1962 No. 1 dan Tambahan Lembaran-Negara No. 2372); d. Penetapan Presiden No.
  1 tahun 1963 tentang Pemerintahan Irian Barat segera setelah diserahkan kepada Republik
  Indonesia; Mendengar : Menteri Pertama, Wakil Menteri Pertama Bidang Pertahanan/Keamanan
  merangkap Wakil Panglima Besar Komando Tertinggi Pembebasan Irian Barat, Wakil Menteri
  Pertama Koordinator Irian Barat, Kepala Staf Komando Tertinggi/Pembebasan Irian
  Barat dan Wakil Menteri Pertama/Menteri lain yang bersangkutan; Memutuskan: Menetapkan
  ; Peraturan Presiden tentang Status dan Kedudukan Keuangan Pegawai Negeri Sipil
  dan Anggota Angkatan Kepolisian di Propinsi Irian Barat'
