id: pp-1985-038
judul: 'Peraturan Pemerintah Nomor 38 Tahun 1985 tentang Peraturan Pemerintah tentang
  Kewenangan Penyidikan Terhadap Pelanggaran Lalu Lintas dan Angkutan Jalan Raya;
  Mengingat: 1. Pasal 5 ayat (2) Undang-Undang Dasar 1945 2. Undang-undang Nomor 13
  Tahun 1961 tentang Ketentuan-ketentuan Pokok Kepolisian Negara (Lembaran Negara
  Tahun 1961 Nomor 245, Tambahan Lembaran Negara Nomor 2289); 3. Undang-undang Nomor
  3 Tahun 1965 tentang Lalu Lintas dan Angkutan Jalan Raya (Lembaran Negara Tahun
  1965 Nomor 25, Tambahan Lembaran Negara Nomor 2742); 4. Undang-undang Nomor 5 Tahun
  1974 tentang Pokok-pokok Pemerintahan di Daerah (Lembaran Negara Tahun 1974 Nomor
  38, Tambahan Lembaran Negara Nomor 3037); 5. Undang-undang Nomor 8 Tahun 1981 tentang
  Hukum Acara Pidana (Lembaran Negara Tahun 1981 Nomor 76, Tambahan Lembaran Negara
  Nomor 3209); www.djpp.depkumham.go.id <!-- page: 2 --> 6. Peraturan Pemerintah Nomor
  16 Tahun 1958 tentang Penyerahan Urusan Lalu Lintas Jalan Kepada Daerah Tingkat
  I (Lembaran Negara Tahun 1958 Nomor 28, Tambahan Lembaran Negara Nomor 1557).; 7.
  Peraturan Pemerintah Nomor 27 Tahun 1983 tentang Pelaksanaan Kitab Undang-undang
  Hukum Acara Pidana (Lembaran Negara Tahun 1983 Nomor 36, Tambahan Lembaran Negara
  Nomor 3258); MEMUTUSKAN: Menetapkan: PERATURAN PEMERINTAH REPUBLIK INDONESIA TENTANG
  KEWENANGAN PENYIDIKAN TERHADAP PELANGGARAN LALU LINTAS DAN ANGKUTAN JALAN RAYA'
