id: pp-2013-099
judul: Peraturan Pemerintah Nomor 99 Tahun 2013 tentang 2 (dua) Badan Penyelenggara
  Jaminan Sosial yaitu BPJS Kesehatan dan BPJS Ketenagakerjaan untuk melaksanakan
  program jaminan sosial nasional. BPJS Kesehatan melaksanakan program jaminan kesehatan
  sedangkan BPJS Ketenagakerjaan melaksanakan program jaminan kecelakaan kerja, jaminan
  kematian, jaminan hari tua, dan jaminan pensiun bagi pemberi kerja dan pekerja penerima
  upah. BPJS Ketenagakerjaan melaksanakan program-program tersebut melalui kontribusi
  dari Iuran pemberi kerja dan pekerja. Penggunaan metode tersebut memberikan implikasi
  bahwa kewajiban kepada www.djpp.kemenkumham.go.id No. 5486 2 peserta harus dapat
  dipenuhi dari Iuran tersebut. Untuk itu, badan penyelenggara harus dapat mengelola
  dan mengembangkan secara terarah dana yang berasal dari Iuran tersebut sehingga
  pemenuhan jaminan, perlindungan, dan peningkatan kesejahteraan tenaga kerja beserta
  keluarganya dapat dilakukan secara optimal. Dengan demikian, salah satu prasyarat
  keberhasilan pencapaian tujuan penyelenggaraan program Jaminan Sosial adalah adanya
  keberhasilan dalam pengelolaan dana yang berasal dari Iuran para peserta tersebut.
  Sebagai salah satu usaha pencapaian tujuan penyelenggaraan program jaminan sosial
  ini, BPJS Ketenagakerjaan sebagai pihak pengelola program tersebut perlu untuk melakukan
  pengelolaan dan pengembangan dana dengan memperhatikan aspek likuiditas, solvabilitas,
  kehati-hatian, keamanan dana, dan hasil yang memadai. Selain penerapan aspek tersebut
  diatas, penerapan tata kelola badan penyelenggara yang baik merupakan faktor yang
  turut mendorong tercapainya tujuan dimaksud. Dalam rangka memberikan arahan agar
  BPJS Ketenagakerjaan senantiasa dapat melakukan pengelolaan dan pengembangan dana
  program Jaminan Sosial Ketenagakerjaan dengan baik, diperlukan adanya ketentuan
  peraturan perundang-undangan yang khusus mengatur mengenai hal tersebut. Sejalan
  dengan perkembangan perekonomian nasional dan terbukanya kesempatan yang lebih luas
  untuk melakukan penempatan investasi pada jenis-jenis investasi yang baru, serta
  untuk mengatasi permasalahan-permasalahan yang timbul berkaitan dengan pengelolaan
  Investasi dana program Jaminan Sosial Ketenagakerjaan tersebut kiranya ketentuan-ketentuan
  mengenai pengelolaan dana dan Investasi program Jaminan Sosial Ketenagakerjaan perlu
  untuk disesuaikan dengan kondisi yang berlaku saat ini. II. PASAL DEMI PASAL
