id: pp-2010-086
judul: 'Peraturan Pemerintah Nomor 86 Tahun 2010 tentang Peraturan Pemerintah tentang
  Penambahan Penyertaan Modal Negara Republik Indonesia Ke Dalam Modal Saham Perusahaan
  Perseroan (Persero) PT Asuransi Kredit Indonesia; www.djpp.depkumham.go.id <!--
  page: 2 --> .g m ha Mengingat : 1. Pasal 5 ayat (2) Undang-Undang Dasar Negara Republik
  Indonesia Tahun 1945; m 2. Undang-Undang Nomor 19 Tahun 2003 tentang Badan Usaha
  Milik Negara (Lembaran Negara Republik Indonesia Tahun 2003 Nomor 70, Tambahan Lembaran
  ku Negara Republik Indonesia Nomor 4297); 3. Undang-Undang Nomor 1 Tahun 2004 tentang
  ep Perbendaharaan Negara (Lembaran Negara Republik Indonesia Tahun 2004 Nomor 5,
  Tambahan Lembaran Negara Republik Indonesia Nomor 4355); 4. Undang-Undang Nomor
  47 Tahun 2009 tentang Anggaran Pendapatan dan Belanja Negara Tahun Anggaran 2010
  (Lembaran Negara Republik Indonesia Tahun 2009 Nomor 156, Tambahan Lembaran Negara
  Republik Indonesia Nomor 5075) sebagaimana telah diubah dengan Undang-Undang Nomor
  2 Tahun 2010 tentang Perubahan Atas Undang-Undang Nomor 47 Tahun 2009 tentang Anggaran
  Pendapatan dan Belanja Negara Tahun Anggaran 2010 (Lembaran Negara Republik Indonesia
  Tahun 2010 Nomor 69, Tambahan Lembaran Negara Republik Indonesia Nomor 5132); 5.
  Peraturan Pemerintah Nomor 44 Tahun 2005 tentang Tata Cara Penyertaan dan Penatausahaan
  Modal Negara pada Badan Usaha Milik Negara dan Perseroan Terbatas (Lembaran Negara
  Republik Indonesia Tahun 2005 Nomor 116, Tambahan Lembaran Negara Republik Indonesia
  Nomor 4555); MEMUTUSKAN : Menetapkan : PERATURAN PEMERINTAH TENTANG PENAMBAHAN PENYERTAAN
  MODAL NEGARA REPUBLIK INDONESIA KE DALAM MODAL SAHAM PERUSAHAAN PERSEROAN (PERSERO)
  PT ASURANSI KREDIT INDONESIA. www.djpp.depkumham.go.id <!-- page: 3 --> .g m'
