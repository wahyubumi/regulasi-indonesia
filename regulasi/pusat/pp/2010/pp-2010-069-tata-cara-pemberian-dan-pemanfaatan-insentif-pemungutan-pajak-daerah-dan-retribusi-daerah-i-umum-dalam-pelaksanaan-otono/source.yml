id: pp-2010-069
judul: Peraturan Pemerintah Nomor 69 Tahun 2010 tentang TATA CARA PEMBERIAN DAN PEMANFAATAN
  INSENTIF PEMUNGUTAN PAJAK DAERAH DAN RETRIBUSI DAERAH I. UMUM Dalam pelaksanaan
  otonomi daerah, dituntut kemandirian pemerintahan daerah untuk dapat melaksanakan
  kebijakan desentralisasi fiskal secara lebih bertanggungjawab. Oleh karena itu,
  Pajak dan Retribusi yang telah diserahkan menjadi urusan pemerintah daerah sebagai
  bagian dari kebijakan desentralisasi fiskal baik untuk provinsi maupun kabupaten/kota
  harus dikelola dan ditingkatkan sebagai salah satu sumber pendapatan daerah. Hal
  ini
