id: pp-2009-006
judul: Peraturan Pemerintah Nomor 6 Tahun 2009 tentang JENIS DAN TARIF ATAS JENIS
  PENERIMAAN NEGARA BUKAN PAJAK YANG BERLAKU PADA DEPARTEMEN PERHUBUNGAN I. UMUM Sehubungan
  dengan adanya perubahan organisasi dan penyesuaian terhadap jenis dan tarif atas
  jenis Penerimaan Negara Bukan Pajak yang berlaku pada Departemen Perhubungan, perlu
  mengganti Peraturan Pemerintah Nomor 14 Tahun 2000 tentang Tarif atas Jenis Penerimaan
  Negara Bukan Pajak yang Berlaku Pada Departemen Perhubungan sebagaimana telah diubah
  dengan Peraturan Pemerintah Nomor 27 Tahun 2005 tentang Perubahan atas Peraturan
  Pemerintah Nomor 14 Tahun 2000 tentang Tarif Atas Jenis Penerimaan Negara Bukan
  Pajak yang Berlaku pada Departemen Perhubungan. Hal tersebut sejalan dengan upaya
  mengoptimalkan Penerimaan Negara Bukan Pajak, guna menunjang pembangunan nasional,
  sebagai salah satu sumber penerimaan negara perlu dikelola dan dimanfaatkan untuk
  peningkatan pelayanan kepada masyarakat. Sehubungan dengan hal tersebut dan dalam
  rangka memenuhi ketentuan Undang-Undang Nomor 20 Tahun 1997 tentang Penerimaan Negara
  Bukan www.peraturan.go.id No. 4973 2 Pajak, perlu menetapkan jenis dan tarif atas
  jenis Penerimaan Negara Bukan Pajak yang berlaku pada Departemen Perhubungan. II.
