judul: PETUNJUK PELAKSANAAN TATA NASKAH DINAS DI LINGKUNGAN KEMENTERIAN SOSIAL BAB
  I PENDAHULUAN A. Latar Belakang Ketatalaksanaan Pemerintah merupakan pengaturan
  tentang cara melaksanakan tugas dan fungsi dalam berbagai bidang kegiatan pemerintahan
  dan pembangunan di lingkungan instansi pemerintah. Salah satu komponen penting dalam
  ketatalaksanaan pemerintah adalah administrasi umum. Ruang lingkup administrasi
  umum meliputi tata naskah dinas, penamaan lembaga, singkatan dan akronim, kearsipan,
  serta tata ruang perkantoran. Tata naskah dinas sebagai salah satu unsur administrasi
  umum meliputi antara lain pengaturan tentang jenis dan penyusunan naskah dinas,
  penggunaan lambang negara, logo dan cap dinas, penggunaan bahasa Indonesia yang
  baik dan benar, pengurusan naskah dinas, korespondensi, kewenangan, perubahan, pencabutan,
  pembatalan produk hukum, dan ralat. Ketentuan tentang tata naskah dinas yang berlaku
  untuk seluruh instansi pemerintah telah diatur dalam Peraturan
